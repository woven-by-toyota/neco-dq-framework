[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neco-dq-framework"
description = "YAML-driven Data Quality framework for Databricks"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "Claudio Basilico" },
]
maintainers = [
  { name = "Claudio Basilico" },
]
keywords = ["data-quality", "spark", "databricks", "great-expectations", "data-validation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Quality Assurance",
]
dynamic = ["version"]

dependencies = [
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "great_expectations>=1.9.0",
  "asteval>=0.9.30",
  "pandas>=2.0,<3.0",  # Pin to pandas 2.x to avoid PySpark compatibility issues
  # GE transitives: cap below the Databricks Runtime's own pins so installing
  # the wheel doesn't upgrade DBR packages out from under mlflow/langchain
  # (packaging<26) and dataclasses-json (marshmallow<4). GE 1.23 accepts both.
  "packaging<26",
  "marshmallow<4",
]

[project.urls]
Homepage = "https://github.com/woven-by-toyota/neco-dq-framework"
Repository = "https://github.com/woven-by-toyota/neco-dq-framework"
Documentation = "https://woven-by-toyota.github.io/neco-dq-framework/"
Issues = "https://github.com/woven-by-toyota/neco-dq-framework/issues"

[tool.setuptools]
license-files = ["LICENSE", "NOTICE", "LICENSES/*", "THIRD_PARTY_NOTICES.txt"]

[tool.setuptools.dynamic]
version = { attr = "neco_dq.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["neco_dq*"]
exclude = ["neco_dq_ui*"]

[tool.setuptools.package-data]
"neco_dq" = ["**/*.yaml", "**/*.yml", "**/*.lvdash.json"]

[tool.setuptools.exclude-package-data]
"*" = ["docs/*"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-html>=4.0",
  "allure-pytest>=2.13",
  "pyspark>=3.5.0",
  "ruff>=0.6.0",
  "bump-my-version>=1.2.4",
  "build>=1.0.0",
]
# Lint extra: adds Ruff on top of the core project deps. Excludes the heavy
# dev/test deps (pyspark, pytest, etc.), so the lint job installs far less.
# Ruff stays pinned consistently with `dev` via the shared uv.lock.
lint = [
  "ruff>=0.6.0",
]
docs = [
  "mkdocs-material>=9.0",
]

# Version bumping configuration
[tool.bumpversion]
current_version =  "1.4.1"
allow_dirty = false
commit = true
message = "chore: bump version {current_version} → {new_version}"
tag = true
tag_name = "v{new_version}"
tag_message = "v{new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'current_version =  "{current_version}"'
replace = 'current_version =  "{new_version}"'

[[tool.bumpversion.files]]
filename = "neco_dq/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["neco_dq"]
branch = true
omit = [
  "*/tests/*",
  "*/__pycache__/*",
  "neco_dq_ui/*",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
show_missing = true
# fail_under = 80  # Enable when CI runs with pyspark

[tool.ruff]
indent-width = 4
line-length = 120
target-version = "py311"
exclude = [
  ".git",
  ".ipynb_checkpoints",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
  ".venv",
  ".venv-ui",
  ".vscode",
  "build",
  "dist",
  "README.md",
  "uv.lock",
]

[tool.ruff.lint]
select = [
  "I",   # iSort
  "F",   # PyFlakes
  "E",   # pycodestyle
  "W",   # Warning
  "N",   # pep8-naming
  "YTT", # flake8-2020
  "B",   # flake8-bugbear
  "A",   # flake8-builtins
  "C4",  # flake8-comprehensions
  "DTZ", # flake8-datetimez
  "T10", # flake8-debugger
  "G",   # flake8-logging-format
  "T20", # flake8-print
  "PT",  # flake8-pytest-style
  "RET", # flake8-return
  "SIM", # flake8-simplify
  "TID", # flake8-tidy-imports
  "ARG", # flake8-unused-arguments
  "PTH", # flake8-use-pathlib
  "ERA", # eradicate
  "PLC", # Pylint Convention
  "PLE", # Pylint Error
  "PLR", # Pylint Refactor
  "PLW", # Pylint Warning
]
extend-select = [
  "RUF",
  "UP",
  "PTH118",
  "UP031",
  "UP032",
  "TD001",
  "TD004",
  "TD005",
  "TD006",
  "TD007",
  "E501",
]
ignore = [
  "PLR0913", # Too many arguments to function call
  "PLR0917", # Too many positional arguments
  "I001",    # Import block is un-sorted or un-formatted
  "RET505",  # Unnecessary `else` after `return` statement
  "G004",    # Logging statement uses f-string
  "N815",    # Variable in class scope should not be mixedCase
  "PT028",   # Argument default in function definition
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = 120

[tool.ruff.lint.per-file-ignores]
# UI code has complex render functions - ignore complexity and some style rules
"neco_dq_ui/**/*.py" = [
    "PLR0912",  # Too many branches
    "PLR0915",  # Too many statements
    "PLR0911",  # Too many return statements
    "PLR2004",  # Magic values
    "PLC0415",  # Import not at top level
    "ARG001",   # Unused function argument
    "ARG002",   # Unused method argument
    "DTZ005",   # datetime.now() without tz
    "N812",     # Lowercase imported as non-lowercase
    "SIM102",   # Nested if statements
    "SIM108",   # Use ternary operator
    "E501",     # Line too long - LLM prompt strings and markdown tables are single-line
]
# GE normalizer has complex expectation-type mapping logic
"neco_dq/test_suites/ge/ge_result_normalizer.py" = [
    "PLR0911",  # Too many return statements - narrative details mapping
    "SIM114",   # Combine if branches - explicit mapping is clearer
]
# Test code - magic values, assertions, allure.step with patch, and inline imports are expected
"tests/**/*.py" = [
    "PLR2004",  # Magic values in assertions
    "S101",     # Use of assert
    "SIM117",   # Nested with statements - intentional for allure.step with patch/contextlib
    "SIM116",   # Dictionary instead of if/elif - stub classes need explicit mapping
    "PT018",    # Assertion should be broken down - compound assertions are clearer for multi-condition checks
    "PLC0415",  # Import not at top level - inline imports for test-specific types
    "ARG002",   # Unused method argument - fixtures may not be used directly
    "DTZ001",   # datetime without timezone - acceptable in tests
]
# Spark fixtures need conditional imports and global state for session management
"tests/conftest.py" = [
    "PLW0603",  # Global statement for Spark session management
    "PLC0415",  # Conditional import for optional Spark dependency
]
"tests/fixtures/spark.py" = [
    "PLW0603",  # Global statement for Spark session management
    "PLC0415",  # Conditional import for optional Spark dependency
]
# Databricks scripts - run in notebooks/jobs with lazy imports and print output
"databricks/scripts/**/*.py" = [
    "T201",     # print statements for job output
    "PLC0415",  # Import not at top level - lazy imports for optional deps
    "PTH123",   # open() vs Path.open() - open() is fine
]
# Test suites have complex checks with debug fields and SQL templates
"neco_dq/test_suites/**/*.py" = [
    "PLR0912",  # Too many branches - complex checks with debug instrumentation
    "PLR0915",  # Too many statements - checks have instrumentation
    "E501",     # Line too long - SQL query templates are single-line for readability in JSON
]
# Profile loader uses conditional imports for optional Databricks SDK
"neco_dq/config/profile_loader.py" = [
    "PLC0415",  # Conditional import for optional databricks-sdk
]
# Dashboard provisioning uses lazy imports for the optional databricks-sdk
"neco_dq/dashboards/lakeview.py" = [
    "PLC0415",  # Conditional import for optional databricks-sdk
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = [
    "B101",   # assert - used in tests (excluded dir) and intentionally elsewhere
    "B110",   # try/except/pass - deliberate in Databricks UI resilience code
    "B112",   # try/except/continue - deliberate in file-discovery loops (skip unreadable files)
    "B311",   # random - used only in mock/demo data for the UI, never for security
    "B608",   # hardcoded SQL - Spark queries use trusted table FQNs, not user input
]
