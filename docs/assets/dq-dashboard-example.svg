<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!-- surfaces -->
  <rect x="0" y="0" width="1200" height="760" fill="#f9f9f7"/>
  <style>
    .card { fill:#fcfcfb; stroke:rgba(11,11,11,0.10); stroke-width:1; rx:8; }
    .ttl { fill:#52514e; font-size:13px; font-weight:600; }
    .kpi-label { fill:#898781; font-size:12px; }
    .kpi-val { fill:#0b0b0b; font-size:30px; font-weight:700; }
    .axis { fill:#898781; font-size:12px; }
    .tick { stroke:#e1e0d9; stroke-width:1; }
    .baseline { stroke:#c3c2b7; stroke-width:1; }
    .lbl { fill:#0b0b0b; font-size:12px; }
    .lblw { fill:#ffffff; font-size:12px; font-weight:600; }
  </style>

  <!-- ===== header ===== -->
  <text x="24" y="34" fill="#0b0b0b" font-size="20" font-weight="700">DQ Dashboard</text>
  <text x="24" y="54" fill="#898781" font-size="13">Data quality results — latest run</text>

  <!-- ===== KPI row (6 counters) ===== -->
  <!-- card helper positions: 6 cards across, x from 24, width 182, gap 8 -->
  <g>
    <rect x="24"  y="72" width="182" height="76" rx="8" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
    <text x="40" y="98" class="kpi-label">Last run</text>
    <text x="40" y="130" fill="#0b0b0b" font-size="20" font-weight="700">2026-07-29</text>

    <rect x="214" y="72" width="182" height="76" rx="8" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
    <text x="230" y="98" class="kpi-label">Total tests run</text>
    <text x="230" y="132" class="kpi-val">223</text>

    <rect x="404" y="72" width="182" height="76" rx="8" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
    <text x="420" y="98" class="kpi-label">Overall pass rate</text>
    <text x="420" y="132" fill="#0b0b0b" font-size="30" font-weight="700">96.4<tspan font-size="18">%</tspan></text>

    <rect x="594" y="72" width="182" height="76" rx="8" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
    <text x="610" y="98" class="kpi-label">Failures</text>
    <text x="610" y="132" class="kpi-val">8</text>

    <rect x="784" y="72" width="182" height="76" rx="8" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
    <text x="800" y="98" class="kpi-label">Blocking failures</text>
    <!-- critical status color + it carries a label, not color alone -->
    <text x="800" y="132" fill="#d03b3b" font-size="30" font-weight="700">3</text>
    <text x="890" y="132" fill="#d03b3b" font-size="12" font-weight="600">FAIL</text>

    <rect x="974" y="72" width="202" height="76" rx="8" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
    <text x="990" y="98" class="kpi-label">Tables covered</text>
    <text x="990" y="132" class="kpi-val">9<tspan font-size="16" fill="#898781"> / 12</tspan></text>
  </g>

  <!-- ===== filters row ===== -->
  <g>
    <rect x="24"  y="160" width="376" height="34" rx="6" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
    <text x="38" y="181" fill="#898781" font-size="12">Layer:</text>
    <text x="86" y="181" fill="#0b0b0b" font-size="12" font-weight="600">All</text>
    <path d="M382 174 l6 6 l6 -6" stroke="#898781" stroke-width="1.5" fill="none"/>

    <rect x="412" y="160" width="376" height="34" rx="6" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
    <text x="426" y="181" fill="#898781" font-size="12">Table:</text>
    <text x="470" y="181" fill="#0b0b0b" font-size="12" font-weight="600">All</text>
    <path d="M770 174 l6 6 l6 -6" stroke="#898781" stroke-width="1.5" fill="none"/>

    <rect x="800" y="160" width="376" height="34" rx="6" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
    <text x="814" y="181" fill="#898781" font-size="12">Run date:</text>
    <text x="878" y="181" fill="#0b0b0b" font-size="12" font-weight="600">2026-07-29</text>
    <path d="M1158 174 l6 6 l6 -6" stroke="#898781" stroke-width="1.5" fill="none"/>
  </g>

  <!-- ===== row: pie + two bar charts ===== -->
  <!-- Pass/Fail pie -->
  <rect x="24" y="206" width="376" height="250" rx="8" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="40" y="232" class="ttl">Pass / Fail distribution</text>
  <!-- donut: 96.4% pass (good) 3.6% fail (critical). Full circle r=70 cx=140 cy=340 -->
  <g transform="translate(140,345)">
    <!-- pass arc (good green) nearly full -->
    <circle r="62" fill="none" stroke="#0ca30c" stroke-width="34"
            stroke-dasharray="375.6 14.0" transform="rotate(-90)"/>
    <!-- fail arc (critical) small, 2px surface gap via dasharray offset -->
    <circle r="62" fill="none" stroke="#d03b3b" stroke-width="34"
            stroke-dasharray="10.0 379.6" stroke-dashoffset="-378" transform="rotate(-90)"/>
    <text x="0" y="-2" text-anchor="middle" fill="#0b0b0b" font-size="26" font-weight="700">96.4%</text>
    <text x="0" y="18" text-anchor="middle" fill="#898781" font-size="12">pass</text>
  </g>
  <!-- legend (identity not color-alone) -->
  <g transform="translate(250,315)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="#0ca30c"/>
    <text x="20" y="10" class="lbl">Passed · 215</text>
    <rect x="0" y="26" width="12" height="12" rx="2" fill="#d03b3b"/>
    <text x="20" y="36" class="lbl">Failed · 8</text>
  </g>

  <!-- Tests by Layer (bar) -->
  <rect x="412" y="206" width="376" height="250" rx="8" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="428" y="232" class="ttl">Tests by layer</text>
  <!-- plot area x 452..760, baseline y 420, top y 260; max=110 -->
  <line x1="452" y1="420" x2="760" y2="420" class="baseline"/>
  <!-- bars: bronze 28, silver 40, gold 45, ge 110 ; scale 140px/110 -->
  <g>
    <!-- bronze -->
    <rect x="470" y="384" width="46" height="36" rx="4" fill="#2a78d6"/>
    <text x="493" y="438" text-anchor="middle" class="axis">bronze</text>
    <text x="493" y="378" text-anchor="middle" class="lbl">28</text>
    <!-- silver -->
    <rect x="546" y="369" width="46" height="51" rx="4" fill="#2a78d6"/>
    <text x="569" y="438" text-anchor="middle" class="axis">silver</text>
    <text x="569" y="363" text-anchor="middle" class="lbl">40</text>
    <!-- gold -->
    <rect x="622" y="363" width="46" height="57" rx="4" fill="#2a78d6"/>
    <text x="645" y="438" text-anchor="middle" class="axis">gold</text>
    <text x="645" y="357" text-anchor="middle" class="lbl">45</text>
    <!-- ge -->
    <rect x="698" y="280" width="46" height="140" rx="4" fill="#2a78d6"/>
    <text x="721" y="438" text-anchor="middle" class="axis">ge</text>
    <text x="721" y="274" text-anchor="middle" class="lbl">110</text>
  </g>

  <!-- Tests by Table (bar) -->
  <rect x="800" y="206" width="376" height="250" rx="8" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="816" y="232" class="ttl">Tests by table</text>
  <line x1="840" y1="420" x2="1160" y2="420" class="baseline"/>
  <g>
    <rect x="852"  y="360" width="40" height="60" rx="4" fill="#2a78d6"/>
    <text x="872"  y="438" text-anchor="middle" class="axis">orders</text>
    <rect x="912"  y="340" width="40" height="80" rx="4" fill="#2a78d6"/>
    <text x="932"  y="438" text-anchor="middle" class="axis">events</text>
    <rect x="972"  y="300" width="40" height="120" rx="4" fill="#2a78d6"/>
    <text x="992"  y="438" text-anchor="middle" class="axis">metrics</text>
    <rect x="1032" y="375" width="40" height="45" rx="4" fill="#2a78d6"/>
    <text x="1052" y="438" text-anchor="middle" class="axis">summary</text>
    <rect x="1092" y="390" width="40" height="30" rx="4" fill="#2a78d6"/>
    <text x="1112" y="438" text-anchor="middle" class="axis">users</text>
  </g>

  <!-- ===== heatmap: failed checks by table ===== -->
  <rect x="24" y="468" width="1152" height="268" rx="8" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="40" y="494" class="ttl">Failed checks by table</text>
  <!-- columns = dimensions, rows = tables. sequential blue ramp for magnitude -->
  <!-- header row -->
  <g class="axis" text-anchor="middle">
    <text x="330" y="524">completeness</text>
    <text x="470" y="524">freshness</text>
    <text x="610" y="524">uniqueness</text>
    <text x="750" y="524">validity</text>
    <text x="890" y="524">referential</text>
    <text x="1030" y="524">consistency</text>
  </g>
  <!-- row labels + cells. cell w=130 h=30, x start 265, y start 534, gap 2 (surface gap) -->
  <!-- ramp: 0=surface-ish #eef4fc, low #cde2fb, mid #6da7ec, high #256abf -->
  <g font-size="12">
    <!-- row: orders -->
    <text x="120" y="554" class="lbl">mart.orders</text>
    <rect x="265" y="536" width="130" height="30" rx="2" fill="#cde2fb"/><text x="330" y="555" text-anchor="middle" class="lbl">1</text>
    <rect x="397" y="536" width="130" height="30" rx="2" fill="#eef4fc"/>
    <rect x="529" y="536" width="130" height="30" rx="2" fill="#eef4fc"/>
    <rect x="661" y="536" width="130" height="30" rx="2" fill="#eef4fc"/>
    <rect x="793" y="536" width="130" height="30" rx="2" fill="#eef4fc"/>
    <rect x="925" y="536" width="130" height="30" rx="2" fill="#eef4fc"/>
    <!-- row: events -->
    <text x="120" y="586" class="lbl">clean.events</text>
    <rect x="265" y="568" width="130" height="30" rx="2" fill="#eef4fc"/>
    <rect x="397" y="568" width="130" height="30" rx="2" fill="#6da7ec"/><text x="462" y="587" text-anchor="middle" class="lblw">2</text>
    <rect x="529" y="568" width="130" height="30" rx="2" fill="#eef4fc"/>
    <rect x="661" y="568" width="130" height="30" rx="2" fill="#eef4fc"/>
    <rect x="793" y="568" width="130" height="30" rx="2" fill="#eef4fc"/>
    <rect x="925" y="568" width="130" height="30" rx="2" fill="#eef4fc"/>
    <!-- row: metrics -->
    <text x="120" y="618" class="lbl">mart.metrics</text>
    <rect x="265" y="600" width="130" height="30" rx="2" fill="#eef4fc"/>
    <rect x="397" y="600" width="130" height="30" rx="2" fill="#cde2fb"/><text x="462" y="619" text-anchor="middle" class="lbl">1</text>
    <rect x="529" y="600" width="130" height="30" rx="2" fill="#eef4fc"/>
    <rect x="661" y="600" width="130" height="30" rx="2" fill="#eef4fc"/>
    <rect x="793" y="600" width="130" height="30" rx="2" fill="#256abf"/><text x="858" y="619" text-anchor="middle" class="lblw">3</text>
    <rect x="925" y="600" width="130" height="30" rx="2" fill="#eef4fc"/>
    <!-- row: summary -->
    <text x="120" y="650" class="lbl">mart.summary</text>
    <rect x="265" y="632" width="130" height="30" rx="2" fill="#eef4fc"/>
    <rect x="397" y="632" width="130" height="30" rx="2" fill="#6da7ec"/><text x="462" y="651" text-anchor="middle" class="lblw">2</text>
    <rect x="529" y="632" width="130" height="30" rx="2" fill="#eef4fc"/>
    <rect x="661" y="632" width="130" height="30" rx="2" fill="#eef4fc"/>
    <rect x="793" y="632" width="130" height="30" rx="2" fill="#eef4fc"/>
    <rect x="925" y="632" width="130" height="30" rx="2" fill="#eef4fc"/>
    <!-- row: customers -->
    <text x="120" y="682" class="lbl">clean.users</text>
    <rect x="265" y="664" width="130" height="30" rx="2" fill="#eef4fc"/>
    <rect x="397" y="664" width="130" height="30" rx="2" fill="#eef4fc"/>
    <rect x="529" y="664" width="130" height="30" rx="2" fill="#eef4fc"/>
    <rect x="661" y="664" width="130" height="30" rx="2" fill="#eef4fc"/>
    <rect x="793" y="664" width="130" height="30" rx="2" fill="#eef4fc"/>
    <rect x="925" y="664" width="130" height="30" rx="2" fill="#eef4fc"/>
  </g>
  <!-- ramp legend -->
  <g transform="translate(265,706)">
    <text x="0" y="10" class="axis">fewer</text>
    <rect x="44" y="0" width="26" height="12" fill="#eef4fc"/>
    <rect x="70" y="0" width="26" height="12" fill="#cde2fb"/>
    <rect x="96" y="0" width="26" height="12" fill="#6da7ec"/>
    <rect x="122" y="0" width="26" height="12" fill="#256abf"/>
    <text x="154" y="10" class="axis">more failed checks</text>
  </g>
</svg>
