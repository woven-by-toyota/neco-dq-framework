site_name: Neco DQ Framework
site_url: https://woven-by-toyota.github.io/neco-dq-framework/
repo_url: https://github.com/woven-by-toyota/neco-dq-framework
repo_name: woven-by-toyota/neco-dq-framework
docs_dir: docs

# Pages intentionally kept out of the nav (still built and reachable by direct link)
not_in_nav: |
  /configuration/template-system.md

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.indexes
    - navigation.instant
    - navigation.tracking
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest
    - search.share

  font:
    text: DM Sans
    code: JetBrains Mono

copyright: >
  Copyright &copy; 2026 Toyota Motor Corporation —
  <a href="https://github.com/woven-by-toyota/neco-dq-framework/blob/main/LICENSE">Apache 2.0</a> •
  <a href="contributing/changelog/">Changelog</a>

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/woven-by-toyota/neco-dq-framework
      name: GitHub

extra_css:
  - assets/custom.css

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: "."
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Getting Started: getting-started.md

  - Guides:
      - Installation & Deployment: installation-deployment.md
      - Database Setup: configuration/database-setup.md
      - Modular Configuration: configuration/modular-config.md
      - Single-File Config: configuration/single-file.md
      - Environment Profiles: configuration/profiles.md
      - Failure Policy: configuration/policy.md
      - Running DQ: configuration/run-dq-api.md

  - Test Suites & Checks:
      - Overview: test-suites/index.md
      - Bronze: test-suites/bronze.md
      - Silver: test-suites/silver.md
      - Gold: test-suites/gold.md
      - Profiling: test-suites/profiling.md
      - Great Expectations: test-suites/great-expectations.md
      - Custom Suites: test-suites/custom.md
      - Compare Metric: configuration/compare-metric.md
      - Thresholds: configuration/thresholds.md
      - Parameter Naming Conventions: configuration/naming-conventions.md
      - Data Filtering: configuration/data-filtering.md
      - Tag Filtering: configuration/tags-filtering.md

  - Operations:
      - Slack Alerts: configuration/slack-alerts.md
      - DQ Dashboard (Lakeview): dashboards/lakeview.md
      - Debugging Failures: architecture/debug-experience.md

  - Reference:
      - Architecture: architecture/overview.md
      - Changelog: contributing/changelog.md

  - Roadmap: roadmap.md

  - Contributing:
      - Contribution Guide: contributing/contribution-guide.md
      - Code Quality: contributing/code-quality.md
      - Governance: contributing/governance.md
