name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write # Trusted Publishing (OIDC) to PyPI
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "neco-dq-framework $GITHUB_REF_NAME" \
            --generate-notes \
            dist/neco_dq_framework-${VERSION}-py3-none-any.whl
